name: Release

# Cut a release by pushing a version tag, e.g.:  git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
            target: native
          - os: macos-14          # Apple Silicon arm64 (native)
            suffix: macos-apple-silicon
            target: native
          - os: macos-14          # Intel x86_64, cross-built under Rosetta
            suffix: macos-intel    # (Intel runners queue forever, so we don't use them)
            target: x86_64
          - os: ubuntu-22.04      # oldest supported glibc for wider compatibility
            suffix: linux-x86_64
            target: native
    steps:
      - uses: actions/checkout@v4

      # --- Native toolchain (Windows + Apple Silicon mac) -------------------
      - name: Set up Python (native)
        if: matrix.target == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 needs a few system libs present at build time on Linux.
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Build (native)
        if: matrix.target == 'native'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pyinstaller packaging/djmigrationkit.spec --distpath dist --workpath build --noconfirm

      # --- x86_64 toolchain (Intel mac, via Rosetta on Apple Silicon) -------
      - name: Set up x86_64 Python (Intel target)
        if: matrix.target == 'x86_64'
        run: |
          set -euxo pipefail
          softwareupdate --install-rosetta --agree-to-license || true
          curl -sSL -o /tmp/python.pkg https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /

      - name: Build (x86_64 under Rosetta)
        if: matrix.target == 'x86_64'
        run: |
          set -euxo pipefail
          PY=/usr/local/bin/python3.12
          arch -x86_64 "$PY" -m pip install --upgrade pip
          arch -x86_64 "$PY" -m pip install -e ".[dev]"
          arch -x86_64 "$PY" -m PyInstaller packaging/djmigrationkit.spec --distpath dist --workpath build --noconfirm

      - name: Resolve tag name
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DJMigrationKit -DestinationPath "dj-migration-kit-${{ steps.tag.outputs.name }}-${{ matrix.suffix }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DJMigrationKit.app "dj-migration-kit-${{ steps.tag.outputs.name }}-${{ matrix.suffix }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf "dj-migration-kit-${{ steps.tag.outputs.name }}-${{ matrix.suffix }}.tar.gz" DJMigrationKit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suffix }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach builds to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DJ Migration Kit ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
