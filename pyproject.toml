[project]
name = "dj-migration-kit"
version = "0.2.0.dev0"
description = "DJ Migration Kit — sync cues, beatgrids and playlists between Traktor, Rekordbox and Mixxx. Never modifies your live libraries."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyrekordbox>=0.4.4",
    "lxml>=5",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
djmk-gui = "djmigrationkit.gui.app:main"
# direction-specific CLIs (a unified `djmk sync` lands with the sync engine)
djmk-rb-to-traktor = "djmigrationkit.cli:main"
djmk-traktor-to-mixxx = "djmigrationkit.cli_mixxx:main"
djmk-mixxx-to-rekordbox = "djmigrationkit.cli_mixxx_rb:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
